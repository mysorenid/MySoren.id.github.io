<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SØREN | Koleksi Baju</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html">SØREN</a>
            <span class="separator">|</span>
        </div>
        
        <ul class="nav-right">
            <li><a href="index.html">Home</a></li>
            <li class="filter-dropdown">
                <a href="javascript:void(0)" onclick="toggleFilter()" class="filter-btn-nav">Filter ▾</a>
                
                <div id="filterMenu" class="filter-popup">
                    <div class="filter-group">
                        <h4>Bahan Kain</h4>
                        <label><input type="checkbox" class="filter-bahan" value="cotton"> Cotton Combed</label>
                        <label><input type="checkbox" class="filter-bahan" value="linen"> Linen</label>
                        <label><input type="checkbox" class="filter-bahan" value="fleece"> Fleece</label>
                    </div>

                    <div class="filter-group" style="margin-top: 15px;">
                        <h4>Ukuran</h4>
                        <div class="size-options">
                            <button class="size-btn" data-size="S">S</button>
                            <button class="size-btn" data-size="M">M</button>
                            <button class="size-btn" data-size="L">L</button>
                        </div>
                    </div>

                    <button class="btn-apply" onclick="terapkanFilter()">Terapkan Filter</button>
                </div>
            </li>
        </ul>
    </nav>

    <section class="product-section">
        <h2>KOLEKSI BAJU</h2>
        <div class="product-grid-detail">
            <div class="product-card" data-bahan="cotton" data-size="S M">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="Baju 1">
                <h3>Premium White Tee</h3>
                <p>Rp 150.000</p>
            </div>

            <div class="product-card" data-bahan="linen" data-size="L">
                <img src="https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=500" alt="Baju 2">
                <h3>Classic Linen Shirt</h3>
                <p>Rp 210.000</p>
            </div>

            <div class="product-card" data-bahan="fleece" data-size="M L">
                <img src="https://images.unsplash.com/photo-1571945153237-4929e783ee4a?w=500" alt="Baju 3">
                <h3>Essential Gray Tee</h3>
                <p>Rp 145.000</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
