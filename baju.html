<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SØREN | Koleksi Baju</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo"><a href="index.html">SØREN</a></div>
        <ul class="nav-right">
            <li><a href="index.html">Home</a></li>
            <li class="filter-dropdown">
                <a href="javascript:void(0)" onclick="toggleFilter()" class="filter-btn-nav">Filter ▾</a>
                <div id="filterMenu" class="filter-popup">
                    <h4>Bahan</h4>
                    <label style="display:block"><input type="checkbox" class="filter-bahan" value="cotton"> Cotton</label>
                    <label style="display:block"><input type="checkbox" class="filter-bahan" value="linen"> Linen</label>
                    <button onclick="terapkanFilter()" style="width:100%; margin-top:10px; background:#756a57; color:white; border:none; padding:8px; cursor:pointer;">Terapkan</button>
                </div>
            </li>
        </ul>
    </nav>

    <section class="product-section">
        <h2>KOLEKSI BAJU</h2>
        <div class="product-grid-detail">
            <div class="product-card" data-bahan="cotton" data-size="M">
                <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500" alt="Baju">
                <h3>Premium White Tee</h3>
                <p>Rp 150.000</p>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
